name: Build Android APK

on:
  push:
    branches: ['main']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        working-directory: noor-app
        run: npm install --legacy-peer-deps

      - name: Run Expo Prebuild
        working-directory: noor-app
        run: npx expo prebuild --platform android --clean

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" > /tmp/keystore.b64
          base64 -d /tmp/keystore.b64 > noor-app/android/app/release.keystore

      - name: Fix build configuration
        run: |
          echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m" >> noor-app/android/gradle.properties
          sed -i "s|classpath('org.jetbrains.kotlin:kotlin-gradle-plugin')|classpath('org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.25')|" noor-app/android/build.gradle
          mkdir -p noor-app/android/app/src/main/res/drawable
          cat > noor-app/android/app/src/main/res/drawable/splashscreen_logo.xml << 'SPLASH'
          <?xml version="1.0" encoding="utf-8"?>
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
            <item android:drawable="@color/splashscreen_background" />
          </layer-list>
          SPLASH

      - name: Build Android APK
        working-directory: noor-app/android
        env:
          RELEASE_KEYSTORE_PATH: app/release.keystore
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Generate release tag
        id: tag
        working-directory: noor-app
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "زاد القرآن الكريم - الإصدار ${{ steps.tag.outputs.version }}"
          body: |
            ## زاد القرآن الكريم - الإصدار ${{ steps.tag.outputs.version }}

            ### أبرز التحديثات والمميزات:
            - **رسم المصحف والخط القرآني المعتمد**: اعتماد الخط الرسمي لمجمع الملك فهد لطباعة المصحف الشريف (KFGQPC-Hafs) في جميع شاشات التطبيق، مع ضبط الحروف والهمزات والمدود لجميع آيات القرآن الكريم (مثل: «ءَاتَىٰكُمۡ»، «لِـَٔادَمَ»، «وَبِٱلْـَٔاخِرَةِ»).
            - **محرك المتشابهات وضوابط التمييز القرآني**: إضافة 283 زوجاً مع الشرح والضوابط من كتاب "إغاثة اللهفان في ضبط متشابهات القرآن" وفهرسة 1307 مواضع متشابهة بالرسم العثماني الدقيق.
            - **موسوعة التفسير الشاملة**: ربط خمسة تفاسير معتمدة كاملة (تفسير ابن كثير، الطبري، القرطبي، السعدي، والوسيط لطنطاوي) مع كل آية من آيات القرآن الكريم.
            - **صحيح أسباب النزول**: عرض أسباب نزول الآيات من الروايات الصحيحة المعتمدة بالسياق التاريخي المرتبط بنص الآية.
            - **الأدعية القرآنية المباركة**: شاشة مخصصة للأدعية الواردة في القرآن الكريم مع زر تشغيل صوتي فوري للاستماع لكل دعاء.
            - **الأذكار وحصن المسلم مع المسبحة الرقمية**: عداد تفاعلي ذكي لكل ذكر مع اهتزاز وإشارة اكتمال «✓ اكتمل» وإمكانية إعادة التعيين.
            - **نظام المفضلة المتقدم**: حفظ الآيات المفضلة مع نص المصحف الرسمي، والاستماع الصوتي، والانتقال المباشر للآية في صفحة السورة.
            - **تصحيح تمارين التحفيظ وإكمال الفراغات**: معالجة ترتيب الكلمات واتجاه العرض من اليمين إلى اليسار وتصحيح مطابقة إكمال الفراغات.

            **Package:** com.anubisland.noor.quran
          files: noor-app/android/app/build/outputs/apk/release/app-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
