name: Build Android APK

on:
  push:
    branches: ['main']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        working-directory: noor-app
        run: npm install --legacy-peer-deps

      - name: Run Expo Prebuild
        working-directory: noor-app
        run: npx expo prebuild --platform android --clean

      - name: Fix build configuration
        run: |
          echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m" >> noor-app/android/gradle.properties
          echo "android.kotlinVersion=1.9.25" >> noor-app/android/gradle.properties
          mkdir -p noor-app/android/app/src/main/res/drawable
          cat > noor-app/android/app/src/main/res/drawable/splashscreen_logo.xml << 'SPLASH'
          <?xml version="1.0" encoding="utf-8"?>
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
            <item android:drawable="@color/splashscreen_background" />
          </layer-list>
          SPLASH

      - name: Build Android APK
        working-directory: noor-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Generate release tag
        id: tag
        working-directory: noor-app
        run: |
          VERSION=$(node -p "require('./package.json').version")
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          TAG="v${VERSION}-${SHORT_SHA}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "Noor Islam ${{ steps.tag.outputs.tag }}"
          body: |
            Automated release from commit ${{ github.sha }}

            **Version:** ${{ steps.tag.outputs.version }}
            **Package:** com.anubisland.noor.quran
          files: noor-app/android/app/build/outputs/apk/release/app-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
