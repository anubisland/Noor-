name: Deploy PWA to GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'noor-app/package-lock.json'

      - name: Install dependencies
        working-directory: noor-app
        run: npm install --legacy-peer-deps

      - name: Export Static Web App (PWA)
        working-directory: noor-app
        env:
          NODE_OPTIONS: "--max-old-space-size=8192"
        run: npx expo export -p web

      - name: Prepare SPA routing & bypass Jekyll for GitHub Pages
        run: |
          cp noor-app/dist/index.html noor-app/dist/404.html
          touch noor-app/dist/.nojekyll
          cp -r noor-app/public/* noor-app/dist/ || true

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'noor-app/dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
